<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gift Games</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">
        <div class="logo">S</div>

        <div class="balance">
            <span>💰</span>
            <strong id="balance">10,000</strong>
            <small> DEMO ETB</small>
        </div>

        <button onclick="showProfile()">👤</button>
    </header>


    <main>

        <section class="welcome">
            <h1>Gift Games</h1>
            <p>Welcome to your gaming center</p>
        </section>


        <section class="wallet-card">

            <p>Available Balance</p>

            <h2>
                <span id="walletBalance">10,000</span>
                ETB
            </h2>

            <div class="wallet-buttons">
                <button onclick="deposit()">
                    ＋ Deposit
                </button>

                <button onclick="withdraw()">
                    Withdraw
                </button>
            </div>

        </section>


        <h2 class="section-title">
            🎮 Featured Games
        </h2>


        <section class="games">

            <div class="game" onclick="openGame('Aviator')">
                <div class="game-icon">✈️</div>
                <h3>Aviator</h3>
                <p>Demo Game</p>
            </div>

            <div class="game" onclick="openGame('Keno')">
                <div class="game-icon">🎱</div>
                <h3>Fast Keno</h3>
                <p>Demo Game</p>
            </div>

            <div class="game" onclick="openGame('Roulette')">
                <div class="game-icon">🎰</div>
                <h3>Roulette</h3>
                <p>Demo Game</p>
            </div>

            <div class="game" onclick="openGame('Bingo')">
                <div class="game-icon">🎟️</div>
                <h3>Bingo</h3>
                <p>Demo Game</p>
            </div>

        </section>

    </main>


    <nav class="bottom-nav">

        <button onclick="home()">🏠<span>Home</span></button>

        <button onclick="games()">🎮<span>Games</span></button>

        <button onclick="deposit()">💰<span>Wallet</span></button>

        <button onclick="showProfile()">👤<span>Profile</span></button>

    </nav>


    <script src="app.js"></script>

</body>
</html>
